name: "CI/CD"

# Practica 3 - Ejercicio 3 - 7
# Variables de entorno a nivel de workflow
env:
  IMAGE_NAME: my-app
  APP_URL: myapp
  IMAGE_REPO: Nieves-16/devops-training-java-app

# Practica 3 - Ejercicio 1 - 4
# Eventos que disparan el workflow
on:
  # Se ejecuta en todas las ramas
  push:
    branches: ['**']

  # Se ejecuta al crear PR con destino develop y master
  pull_request:
    branches: [develop, master]

  # Permite ejecutar el workflow manualmente con un input booleano RUN_CD (default false)
  workflow_dispatch:
    inputs:
      RUN_CD:
        description: "Run CD stage"
        required: false
        default: false
        type: boolean

      # Ejecucion manual con parametros
      DEPLOY_ENV:
        description: "Run environment"
        required: false
        type: choice
        options:
          - DEV
          - PRO

# Practica 3 - Ejercicio 2 - 3 - 4 - 5
# Definicion de jobs
jobs:
  # Job CI
  ci:
    environment: ${{ github.ref_name == 'master' && 'PRO' || 'DEV' }}
    runs-on: ubuntu-latest

    env:
      APP_URL: myappurl

    # Pasos
    steps:

      # Clona el repositorio en el runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Imprimir información del entorno
      - name: Info
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Name: ${{ runner.name }}"

      # Imprimir variables
      - name: Variables
        run: |
          echo "VERSION_JAR=$(cat VERSION)-SNAPSHOT" >> $GITHUB_ENV
          echo "IMAGE_NAME=${IMAGE_REPO}:$(cat VERSION)" >> $GITHUB_ENV
          echo "APP_URL: ${{ env.APP_URL }}"
          echo "REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}"

      # Imprimir parámetros
      - name: Imprimir parametros
        run: |
          echo "RUN_CD value: ${{ inputs.RUN_CD }}"
          echo "DEPLOY_ENV value: ${{ inputs.DEPLOY_ENV }}"

      # Build CI image
      - name: Build CI image
        run: docker build -t java-imagen-ci -f devops/ci.Dockerfile .

      # Lint
      - name: Lint
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/app" -w /app java-imagen-ci sh -lc \
            make lint

      # Test
      - name: Test
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/app" -w /app java-imagen-ci sh -lc \
            make test

      # Build image
      - name: Build image
        run: |
          docker build -t "${IMAGE_NAME}" --build-arg VERSION="${VERSION_JAR}" -f devops/Dockerfile .